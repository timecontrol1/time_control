<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Control de Asistencias</title>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        .card-historial-global { background: #161b22; padding: 20px; border-radius: 8px; border: 1px solid #30363d; margin-top: 20px; }
        h3 { margin-top: 0; color: #f0f6fc; }
        .table-asistencias { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .table-asistencias th, .table-asistencias td { padding: 12px; text-align: left; border-bottom: 1px solid #30363d; font-size: 14px; }
        .table-asistencias th { color: #8b949e; font-weight: bold; }
        .btn-detalles { background-color: #21262d; color: #c9d1d9; border: 1px solid #30363d; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
        .btn-detalles:hover { background-color: #30363d; }
        
        /* Estilos del Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; }
        .modal-content { background: #161b22; padding: 20px; border-radius: 8px; width: 90%; max-width: 400px; border: 1px solid #30363d; }
        .sesion-card-item { background: #21262d; padding: 10px; border-radius: 6px; margin-bottom: 10px; }
        .btn-cerrar { background-color: #da3633; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 10px; }
        .btn-eliminar-sesion { background-color: #da3633; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    </style>
</head>
<body>

    <!-- Sección: Historial Global de Asistencias -->
    <div class="card-historial-global">
        <h3>Historial Global de Asistencias</h3>
        <table class="table-asistencias">
            <thead>
                <tr>
                    <th>Trabajador</th>
                    <th>Fecha</th>
                    <th>Estado / Horas</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="tabla-historial-cuerpo">
                <!-- Los datos se inyectarán correctamente aquí en filas separadas -->
            </tbody>
        </table>
    </div>

    <!-- Modal de Reporte Detallado -->
    <div id="modal-detalles" class="modal-overlay">
        <div class="modal-content">
            <h3 id="titulo-modal-fecha">Reporte Detallado</h3>
            <div id="contenido-sesiones-dia">
                <!-- Listado de entradas y salidas individuales -->
            </div>
            <button class="btn-cerrar" onclick="cerrarModalDetalles()">Cerrar</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
