<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Control de turnos y nómina</title><link rel="stylesheet" href="style.css"></head><body><main><header><h1>🟢 Control de turnos</h1><span id="clock"></span></header><p id="notice" role="status"></p><section id="loginPanel" class="card"><h2>Iniciar sesión</h2><form id="loginForm"><label>Usuario<input id="username" autocomplete="username" required></label><label>PIN<input id="pin" type="password" autocomplete="current-password" required></label><button>Ingresar</button></form></section><section id="appPanel" hidden><div class="card flex"><h2 id="welcome"></h2><button id="logout" class="secondary">Cerrar sesión</button></div><section id="workerPanel" class="card"><h2>Mi turno</h2><p id="shiftStatus">Consultando...</p><button id="shiftButton">Iniciar turno</button><h3>Mis registros</h3><div class="filters"><label>Desde<input type="date" id="workerFrom"></label><label>Hasta<input type="date" id="workerTo"></label><button id="workerRefresh" class="secondary">Actualizar</button></div><div class="scroll"><table><thead><tr><th>Fecha</th><th>Entrada</th><th>Salida</th><th>Horas</th></tr></thead><tbody id="workerRows"></tbody></table></div><p id="workerTotal"></p></section><section id="adminPanel" hidden><div class="card"><h2>Administración y nómina</h2><div class="filters"><label>Desde<input type="date" id="from"></label><label>Hasta<input type="date" id="to"></label><button id="refresh" class="secondary">Actualizar</button></div><div class="actions"><button id="addUser">+ Trabajador</button><button id="addManual">+ Horas manuales</button><button id="addBatch">+ Carga masiva</button><button id="globalRate">Tarifa global</button><button id="payroll">Calcular nómina</button><button id="savePayroll">Guardar reporte de pago</button></div></div><div class="card"><h2>Trabajadores y pagos</h2><div class="scroll"><table><thead><tr><th>Nombre</th><th>Tipo</th><th>Tarifa</th><th>Cargo</th><th>Horas</th><th>Total</th><th>Acciones</th></tr></thead><tbody id="userRows"></tbody></table></div></div><div class="card"><h2>Historial de asistencias</h2><div class="scroll"><table><thead><tr><th>Trabajador</th><th>Fecha</th><th>Estado / horas</th><th>Acción</th></tr></thead><tbody id="historyRows"></tbody></table></div></div><div class="card"><h2>Reportes guardados</h2><div id="reports"></div></div></section></section><dialog id="modal"><form id="modalForm"><h2 id="modalTitle"></h2><div id="modalFields"></div><div class="actions"><button type="button" id="cancel" class="secondary">Cancelar</button><button type="submit">Guardar</button></div></form></dialog></main><script src="app.js"></script></body></html>
