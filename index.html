<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Control - Asistencia y Nómina</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --primary: #10b981;
      --bg-dark: rgba(15, 23, 42, 0.92);
      --card-bg: rgba(30, 41, 59, 0.95);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: #050505 url('https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=1000&auto=format&fit=crop') no-repeat center center fixed;
      background-size: cover;
      color: var(--text);
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container { width: 100%; max-width: 450px; display: flex; flex-direction: column; gap: 16px; }
    .card { background: var(--card-bg); padding: 24px; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); backdrop-filter: blur(8px); border: 1px solid rgba(16, 185, 129, 0.2); }
    h1, h2, h3 { color: var(--text); margin-bottom: 12px; text-align: center; }
    label { display: block; margin-top: 12px; margin-bottom: 4px; font-size: 14px; color: var(--text-muted); }
    input, select { width: 100%; padding: 14px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: white; font-size: 16px; outline: none; }
    input:focus, select:focus { border-color: var(--primary); }
    button { width: 100%; padding: 14px; border-radius: 10px; border: none; background: var(--primary); color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4); }
    button:hover { opacity: 0.9; }
    button.btn-danger { background: var(--danger); box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4); }
    .hidden { display: none !important; }
    .user-list, .history-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    .item-row { background: rgba(51, 65, 85, 0.6); padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
    .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .badge-active { background: #059669; }
    .badge-off { background: #64748b; }
    .tabs { display: flex; gap: 6px; margin-bottom: 16px; }
    .tab-btn { background: #334155; color: white; padding: 10px; font-size: 13px; margin: 0; border-radius: 8px; }
    .tab-btn.active { background: var(--primary); }
  </style>
</head>
<body>

<div class="container">
  <!-- PANTALLA DE LOGIN (ESTILO MATRIX) -->
  <div id="sec-login" class="card">
    <div style="text-align: center; margin-bottom: 16px;">
      <span style="font-size: 40px;">🛡️</span>
      <h2 style="margin-top: 8px;">Control de Asistencia</h2>
      <p style="color: var(--text-muted); font-size: 13px;">Sistema de fichaje y gestión segura</p>
    </div>
    
    <label>Usuario</label>
    <input type="text" id="login-usuario" placeholder="Tu nombre de usuario (ej: admin, ricardo)">
    
    <label>PIN de Acceso</label>
    <input type="password" id="login-pin" placeholder="Tu PIN de acceso" maxlength="10">
    
    <button onclick="login()">Ingresar al Sistema</button>
  </div>

  <!-- PANEL DE TRABAJADOR -->
  <div id="sec-trabajador" class="card hidden">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2 id="worker-title" style="margin:0;">Bienvenido</h2>
      <button onclick="logout()" style="width:auto; padding:8px 12px; margin:0;" class="btn-danger">Salir</button>
    </div>
    <div style="margin-top: 24px; text-align: center;">
      <p style="margin-bottom: 12px;">Estado Actual: <span id="worker-status" class="status-badge badge-off">Fuera de Turno</span></p>
      <button id="btn-fichar" onclick="toggleTurno()" style="font-size:18px; padding:16px;">Iniciar Turno</button>
    </div>
    <h3 style="margin-top: 24px; text-align: left;">Mis Últimos Turnos</h3>
    <div id="worker-history" class="history-list"></div>
  </div>

  <!-- PANEL DE ADMINISTRADOR -->
  <div id="sec-admin" class="card hidden">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2 style="margin:0;">Panel Administrador</h2>
      <button onclick="logout()" style="width:auto; padding:8px 12px; margin:0;" class="btn-danger">Salir</button>
    </div>

    <div class="tabs" style="margin-top: 20px;">
      <button class="tab-btn active" onclick="switchTab('tab-usuarios')">Usuarios</button>
      <button class="tab-btn" onclick="switchTab('tab-horas')">Carga Manual</button>
      <button class="tab-btn" onclick="switchTab('tab-reportes')">Reportes</button>
    </div>

    <!-- TAB USUARIOS -->
    <div id="tab-usuarios">
      <h3>Lista de Usuarios</h3>
      <div id="admin-user-list" class="user-list"></div>
      
      <h3 style="margin-top:24px;">Agregar Nuevo Usuario</h3>
      <label>Nombre completo</label>
      <input type="text" id="new-user-nombre" placeholder="Ej: Ronald Pérez">
      <label>Nombre de usuario (minúsculas sin espacios)</label>
      <input type="text" id="new-user-username" placeholder="Ej: ronald">
      <label>PIN de acceso</label>
      <input type="password" id="new-user-pin" placeholder="Ej: 1234">
      <button onclick="crearUsuario()">Registrar Usuario</button>
    </div>

    <!-- TAB CARGA MANUAL DE HORAS -->
    <div id="tab-horas" class="hidden">
      <h3>Importar / Registrar Horas</h3>
      <label>Trabajador</label>
      <select id="import-usuario"></select>
      
      <label>Fecha</label>
      <input type="date" id="import-fecha">
      
      <label>Hora Entrada</label>
      <input type="time" id="import-hora-entrada" value="08:00">
      
      <label>Hora Salida</label>
      <input type="time" id="import-hora-salida" value="17:00">

      <button onclick="registrarHorasManuales()">Guardar Horas</button>
    </div>

    <!-- TAB REPORTES -->
    <div id="tab-reportes" class="hidden">
      <h3>Reporte de Nómina</h3>
      <div id="admin-reports-list" class="history-list"></div>
    </div>
  </div>
</div>

<script src="app.js?v=2"></script>
</body>
</html>
