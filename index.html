<div id="modal-agregar-horas" class="modal-backdrop hidden">
    <div class="modal-box glass-panel">
      <h3 class="neon-title">+ Agregar Horas / Turno Manual</h3>
      <div class="form-group">
        <label>Usuario</label>
        <select id="manual-user-select"></select>
      </div>
      <div class="form-group">
        <label>Fecha de Inicio</label>
        <input type="date" id="manual-fecha">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Hora Entrada</label>
          <input type="time" id="manual-entrada" value="08:00">
        </div>
        <div class="form-group">
          <label>Hora Salida</label>
          <input type="time" id="manual-salida" value="17:00">
        </div>
      </div>
      <div class="modal-actions" style="gap:8px;">
        <button onclick="closeModals()" class="btn-action btn-gray">Cerrar</button>
        <button onclick="guardarHorasManuales(true)" class="btn-action btn-orange">+ Guardar y Agregar Otro</button>
        <button onclick="guardarHorasManuales(false)" class="btn-action btn-green">Guardar y Finalizar</button>
      </div>
    </div>
  </div>
